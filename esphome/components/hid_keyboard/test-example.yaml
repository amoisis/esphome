# HID Keyboard Component - Comprehensive Test Example
#
# This example demonstrates all features of the HID keyboard component
# including various key combinations, modifiers, and automation triggers.
#
# Hardware: ESP32-S3 DevKit (or ESP32-S2/P4 with USB-OTG)
# Connect the USB port to your computer and flash via UART

esphome:
  name: hid-keyboard-test
  friendly_name: HID Keyboard Test

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

# Enable logging
logger:
  hardware_uart: UART0
  level: DEBUG

# Enable Home Assistant API (optional)
api:
  encryption:
    key: "your-encryption-key-here"

# Enable OTA updates
ota:
  - platform: esphome
    password: "your-ota-password"

# WiFi configuration
wifi:
  ssid: "your-ssid"
  password: "your-password"

# Configure TinyUSB - REQUIRED
tinyusb:
  usb_product_id: 0x4001
  usb_vendor_id: 0x303A
  usb_manufacturer_str: "ESPHome"
  usb_product_str: "HID Keyboard Test"
  usb_serial_str: "12345678"

# Configure HID Keyboard
hid_keyboard:
  id: my_keyboard

# Test buttons for manual testing
button:
  # Basic single key tests
  - platform: template
    name: "Test: Type 'A'"
    on_press:
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x04  # A
          modifier: 0x00

  - platform: template
    name: "Test: Type 'Hello'"
    on_press:
      # Type H
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x0B  # H
          modifier: 0x02  # Left Shift
      - delay: 100ms
      # Type e
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x08  # E
      - delay: 100ms
      # Type l
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x0F  # L
      - delay: 100ms
      # Type l
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x0F  # L
      - delay: 100ms
      # Type o
      - hid_keyboard.send_key:
          id: my_keyboard
          key: 0x12  # O
      - delay: 100ms
      - hid_keyboard.release_all:
          id: my_keyboard

  # Keyboard shortcuts
  - platform: template
    name: "Test: Copy (Ctrl+C)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x06  # C
          modifier: 0x01  # Left Control

  - platform: template
    name: "Test: Paste (Ctrl+V)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x19  # V
          modifier: 0x01  # Left Control

  - platform: template
    name: "Test: Select All (Ctrl+A)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x04  # A
          modifier: 0x01  # Left Control

  - platform: template
    name: "Test: Save (Ctrl+S)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x16  # S
          modifier: 0x01  # Left Control

  - platform: template
    name: "Test: Undo (Ctrl+Z)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x1D  # Z
          modifier: 0x01  # Left Control

  # Window management
  - platform: template
    name: "Test: Alt+Tab (Switch Window)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x2B  # Tab
          modifier: 0x04  # Left Alt

  - platform: template
    name: "Test: Win+D (Show Desktop)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x07  # D
          modifier: 0x08  # Left GUI (Windows key)

  - platform: template
    name: "Test: Win+E (Open Explorer)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x08  # E
          modifier: 0x08  # Left GUI

  # Function keys
  - platform: template
    name: "Test: F5 (Refresh)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x3E  # F5

  - platform: template
    name: "Test: F11 (Fullscreen)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x44  # F11

  # Media controls
  - platform: template
    name: "Test: Enter Key"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x28  # Enter

  - platform: template
    name: "Test: Escape Key"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x29  # Escape

  - platform: template
    name: "Test: Space Bar"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x2C  # Space

  - platform: template
    name: "Test: Backspace"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x2A  # Backspace

  # Arrow keys
  - platform: template
    name: "Test: Arrow Up"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x52  # Up Arrow

  - platform: template
    name: "Test: Arrow Down"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x51  # Down Arrow

  - platform: template
    name: "Test: Arrow Left"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x50  # Left Arrow

  - platform: template
    name: "Test: Arrow Right"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x4F  # Right Arrow

  # Multi-modifier test (Ctrl+Shift+Esc = Task Manager)
  - platform: template
    name: "Test: Ctrl+Shift+Esc (Task Manager)"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x29  # Escape
          modifier: 0x03  # Left Control (0x01) + Left Shift (0x02) = 0x03

  # Emergency release all keys
  - platform: template
    name: "EMERGENCY: Release All Keys"
    on_press:
      - hid_keyboard.release_all:
          id: my_keyboard

# Binary sensor example - use GPIO button to trigger keypress
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Physical Button 1"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x2C  # Space bar

  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Physical Button 2"
    on_press:
      - hid_keyboard.send_keypress:
          id: my_keyboard
          key: 0x28  # Enter

# Time-based automation example
time:
  - platform: homeassistant
    id: homeassistant_time

# Example: Send a keypress every minute (commented out for safety)
# interval:
#   - interval: 60s
#     then:
#       - hid_keyboard.send_keypress:
#           id: my_keyboard
#           key: 0x2C  # Space

# =============================================================================
# HID Keyboard Code Reference (USB HID Usage Tables)
# =============================================================================
#
# LETTERS (Keyboard a and A through z and Z):
# A=0x04, B=0x05, C=0x06, D=0x07, E=0x08, F=0x09, G=0x0A, H=0x0B
# I=0x0C, J=0x0D, K=0x0E, L=0x0F, M=0x10, N=0x11, O=0x12, P=0x13
# Q=0x14, R=0x15, S=0x16, T=0x17, U=0x18, V=0x19, W=0x1A, X=0x1B
# Y=0x1C, Z=0x1D
#
# NUMBERS (top row):
# 1=0x1E, 2=0x1F, 3=0x20, 4=0x21, 5=0x22, 6=0x23, 7=0x24, 8=0x25
# 9=0x26, 0=0x27
#
# SPECIAL KEYS:
# Enter=0x28, Escape=0x29, Backspace=0x2A, Tab=0x2B, Space=0x2C
# Minus=0x2D, Equals=0x2E, Left Bracket=0x2F, Right Bracket=0x30
# Backslash=0x31, Semicolon=0x33, Apostrophe=0x34, Grave=0x35
# Comma=0x36, Period=0x37, Slash=0x38, Caps Lock=0x39
#
# FUNCTION KEYS:
# F1=0x3A, F2=0x3B, F3=0x3C, F4=0x3D, F5=0x3E, F6=0x3F
# F7=0x40, F8=0x41, F9=0x42, F10=0x43, F11=0x44, F12=0x45
#
# SYSTEM KEYS:
# Print Screen=0x46, Scroll Lock=0x47, Pause=0x48, Insert=0x49
# Home=0x4A, Page Up=0x4B, Delete=0x4C, End=0x4D, Page Down=0x4E
#
# ARROW KEYS:
# Right Arrow=0x4F, Left Arrow=0x50, Down Arrow=0x51, Up Arrow=0x52
#
# NUMPAD (when Num Lock is on):
# Num Lock=0x53, Numpad /=0x54, Numpad *=0x55, Numpad -=0x56
# Numpad +=0x57, Numpad Enter=0x58, Numpad 1=0x59, Numpad 2=0x5A
# Numpad 3=0x5B, Numpad 4=0x5C, Numpad 5=0x5D, Numpad 6=0x5E
# Numpad 7=0x5F, Numpad 8=0x60, Numpad 9=0x61, Numpad 0=0x62
# Numpad .=0x63
#
# MODIFIERS (can be combined with bitwise OR):
# Left Control=0x01    (Ctrl)
# Left Shift=0x02      (Shift)
# Left Alt=0x04        (Alt)
# Left GUI=0x08        (Windows/Command key)
# Right Control=0x10
# Right Shift=0x20
# Right Alt=0x40       (AltGr on some keyboards)
# Right GUI=0x80
#
# COMBINING MODIFIERS:
# Ctrl+Shift = 0x03 (0x01 | 0x02)
# Ctrl+Alt = 0x05 (0x01 | 0x04)
# Ctrl+Shift+Alt = 0x07 (0x01 | 0x02 | 0x04)
# =============================================================================
