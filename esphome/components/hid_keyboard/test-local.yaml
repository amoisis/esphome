# Local testing config - uses local component source
esphome:
  name: hid-keyboard-local
  friendly_name: HID Keyboard Local Test

esp32:
  board: lolin_s3_mini
  variant: ESP32S3
  framework:
    type: esp-idf
    sdkconfig_options:
      # Disable the native USB Serial/JTAG driver so TinyUSB can take over
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "n"
      # Send logs to UART0 (TX/RX pins) to avoid breaking USB timing
      # Note: You won't see logs on the USB cable in this mode!
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "y"
      CONFIG_ESP_CONSOLE_UART_NUM: "0"
      # Enable TinyUSB HID
      CONFIG_TINYUSB_ENABLED: "y"
      CONFIG_TINYUSB_HID_ENABLED: "y"
      CONFIG_TINYUSB_HID_COUNT: 1
      # Disable CDC to avoid composite complexity for now
      CONFIG_TINYUSB_CDC_ENABLED: "n"

logger:
  hardware_uart: UART0
  level: DEBUG

# WiFi (optional for local testing)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

# Configure TinyUSB
tinyusb:
  usb_vendor_id: 0x303A
  usb_product_id: 0x4001
  usb_manufacturer_str: "ESPHome"
  usb_product_str: "HID Keyboard Test"

# HID Keyboard - uses local component
hid_keyboard:
  id: kbd

# Test buttons
button:
  - platform: template
    name: "Test: Type A"
    on_press:
      - hid_keyboard.send_keypress:
          id: kbd
          key: 0x04  # Letter A

  - platform: template
    name: "Test: Ctrl+C"
    on_press:
      - hid_keyboard.send_keypress:
          id: kbd
          key: 0x06  # C
          modifier: 0x01  # Ctrl

  - platform: template
    name: "Release All"
    on_press:
      - hid_keyboard.release_all:
          id: kbd
