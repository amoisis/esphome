# Local testing config - uses local component source
esphome:
  name: hid-keyboard-local
  friendly_name: HID Keyboard Local Test

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "y"
      CONFIG_ESP_CONSOLE_UART_NUM: "0"

logger:
  hardware_uart: UART0
  level: DEBUG

# WiFi (optional for local testing)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

# Configure TinyUSB
tinyusb:
  usb_vendor_id: 0x303A
  usb_product_id: 0x4001
  usb_manufacturer_str: "ESPHome"
  usb_product_str: "HID Keyboard Test"

# HID Keyboard - uses local component
hid_keyboard:
  id: kbd

# Test buttons
button:
  - platform: template
    name: "Test: Type A"
    on_press:
      - hid_keyboard.send_keypress:
          id: kbd
          key: 0x04  # Letter A

  - platform: template
    name: "Test: Ctrl+C"
    on_press:
      - hid_keyboard.send_keypress:
          id: kbd
          key: 0x06  # C
          modifier: 0x01  # Ctrl

  - platform: template
    name: "Release All"
    on_press:
      - hid_keyboard.release_all:
          id: kbd
